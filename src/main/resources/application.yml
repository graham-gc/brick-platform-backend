server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: BrickPlatform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/brick_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Pacific/Auckland}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: ${APP_TIME_ZONE:Pacific/Auckland}

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: apiworkflow.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"
  level:
    apiworkflow: ${APP_LOG_LEVEL:INFO}
    org.springframework: ${SPRING_LOG_LEVEL:INFO}

brick:
  mock-commerce:
    enabled: ${MOCK_COMMERCE_ENABLED:true}
    port: ${MOCK_COMMERCE_PORT:9090}

springdoc:
  packages-to-scan: apiworkflow.controller
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    filter: true
    operations-sorter: method
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: Brick Platform
    description: API workflow automation platform
    version: ${APP_VERSION:1.0-SNAPSHOT}
